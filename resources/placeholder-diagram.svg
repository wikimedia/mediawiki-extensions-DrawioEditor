<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Diagram placeholder">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0b1a33" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa5b4"/>
    </marker>
  </defs>

  <!-- canvas frame -->
  <rect x="6" y="6" width="588" height="388" rx="18" fill="#f7f9fc" stroke="#e3e8ef" stroke-width="2"/>

  <!-- connectors -->
  <g fill="none" stroke="#9aa5b4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300,140 V196 H190 V244" marker-end="url(#arrow)"/>
    <path d="M300,140 V196 H410 V244" marker-end="url(#arrow)"/>
  </g>

  <!-- top node -->
  <g filter="url(#cardShadow)">
    <rect x="200" y="50" width="200" height="90" rx="12" fill="#ffffff" stroke="#cfd8e3" stroke-width="2"/>
  </g>
  <rect x="224" y="76" width="152" height="13" rx="6.5" fill="#5b8def"/>
  <rect x="224" y="100" width="104" height="9" rx="4.5" fill="#dbe1ea"/>

  <!-- bottom-left node (card with avatar) -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="250" width="200" height="100" rx="12" fill="#ffffff" stroke="#cfd8e3" stroke-width="2"/>
  </g>
  <circle cx="124" cy="300" r="20" fill="#cdd9f7"/>
  <rect x="156" y="290" width="106" height="12" rx="6" fill="#dbe1ea"/>
  <rect x="156" y="311" width="74" height="9" rx="4.5" fill="#e6ebf2"/>

  <!-- bottom-right node -->
  <g filter="url(#cardShadow)">
    <rect x="310" y="250" width="200" height="100" rx="12" fill="#ffffff" stroke="#cfd8e3" stroke-width="2"/>
  </g>
  <rect x="336" y="282" width="140" height="12" rx="6" fill="#dbe1ea"/>
  <rect x="336" y="304" width="100" height="9" rx="4.5" fill="#e6ebf2"/>
  <rect x="336" y="322" width="120" height="9" rx="4.5" fill="#e6ebf2"/>
</svg>
